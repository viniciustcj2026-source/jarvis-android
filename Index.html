
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050b14;
      color: #7cecff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      letter-spacing: 5px;
      text-shadow: 0 0 15px #00cfff;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #7398ad;
      font-size: 13px;
    }

    .core {
      width: 180px;
      height: 180px;
      border: 2px solid #00cfff;
      border-radius: 50%;
      margin: 28px 0;
      display: grid;
      place-items: center;
      box-shadow: 0 0 25px #007da8,
                  inset 0 0 25px #007da8;
      animation: pulse 3s infinite;
    }

    .core span {
      font-size: 62px;
      text-shadow: 0 0 20px #00cfff;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 40px #00cfff,
                         inset 0 0 35px #007da8; }
    }

    #status {
      color: #8ba9ba;
      margin: 8px;
      text-align: center;
    }

    #chat {
      width: 100%;
      max-width: 480px;
      height: 260px;
      overflow-y: auto;
      border: 1px solid #16445b;
      border-radius: 12px;
      padding: 12px;
      background: #081522;
      margin: 15px 0;
    }

    .message {
      margin: 10px 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user { color: #ffffff; }
    .jarvis { color: #7cecff; }

    .controls {
      display: flex;
      width: 100%;
      max-width: 480px;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #0b1d2b;
      border: 1px solid #17617b;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-size: 16px;
    }

    button {
      background: #063d55;
      color: #7cecff;
      border: 1px solid #00cfff;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:active { background: #08799b; }

    #mic {
      margin-top: 10px;
      width: 100%;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>

  <div class="core"><span>◉</span></div>

  <div id="status">Sistemas inicializados.</div>

  <div id="chat">
    <div class="message jarvis">
      <b>JARVIS:</b> Olá, senhor. Estou pronto para o primeiro teste.
    </div>
  </div>

  <div class="controls">
    <input id="input" placeholder="Digite uma mensagem..."
           autocomplete="off">
    <button id="send">Enviar</button>
  </div>

  <button id="mic">🎙️ Falar com JARVIS</button>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const status = document.getElementById("status");

    function say(text, who) {
      const line = document.createElement("div");
      line.className = "message " + who;
      const label = document.createElement("b");
      label.textContent = who === "user" ? "VOCÊ: " : "JARVIS: ";
      line.appendChild(label);
      line.appendChild(document.createTextNode(text));
      chat.appendChild(line);
      chat.scrollTop = chat.scrollHeight;
    }

    function respond(text) {
      const msg = text.toLowerCase();
      let answer;

      if (msg.includes("olá") || msg.includes("oi")) {
        answer = "Olá, senhor. É bom falar com você.";
      } else if (msg.includes("seu nome")) {
        answer = "Meu nome é JARVIS, seu assistente pessoal.";
      } else if (msg.includes("tudo bem")) {
        answer = "Todos os sistemas estão operacionais, senhor.";
      } else if (msg.includes("quem é você")) {
        answer = "Sou seu protótipo de assistente pessoal. Ainda estou aprendendo.";
      } else if (msg.includes("hora")) {
        answer = "A hora do seu dispositivo é " +
          new Date().toLocaleTimeString("pt-BR") + ".";
      } else if (msg.includes("obrigado") || msg.includes("obrigada")) {
        answer = "Sempre à disposição, senhor.";
      } else if (msg.includes("jarvis")) {
        answer = "Sim, senhor? Estou ouvindo.";
      } else {
        answer = "Ainda não sei responder a isso. No futuro, vamos conectar uma IA de verdade.";
      }

      say(answer, "jarvis");
      speak(answer);
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      say(text, "user");
      input.value = "";
      respond(text);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = "pt-BR";
      voice.rate = 1;
      window.speechSynthesis.speak(voice);
    }

    document.getElementById("send").addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") sendMessage();
    });

    document.getElementById("mic").addEventListener("click", function() {
      const Recognition = window.SpeechRecognition ||
                          window.webkitSpeechRecognition;

      if (!Recognition) {
        status.textContent =
          "Microfone não suportado neste navegador. Tente o Chrome.";
        return;
      }

      const recognition = new Recognition();
      recognition.lang = "pt-BR";
      recognition.onstart = () => status.textContent = "Estou ouvindo...";
      recognition.onresult = event => {
        input.value = event.results[0][0].transcript;
        sendMessage();
      };
      recognition.onerror = () =>
        status.textContent = "Não consegui ouvir. Tente novamente.";
      recognition.onend = () =>
        status.textContent = "Sistemas inicializados.";
      recognition.start();
    });
  </script>
</body>
</html>
