
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Android</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050b16;
      color: #62eaff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 {
      margin-top: 35px;
      letter-spacing: 7px;
      text-shadow: 0 0 18px #00bfff;
    }
    .orb {
      width: 130px;
      height: 130px;
      border: 3px solid #62eaff;
      border-radius: 50%;
      margin: 25px;
      box-shadow: 0 0 25px #00bfff, inset 0 0 25px #00bfff;
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(.94); opacity: .65; }
      to { transform: scale(1.04); opacity: 1; }
    }
    #chat {
      width: 100%;
      max-width: 600px;
      min-height: 150px;
      border: 1px solid #176b8b;
      border-radius: 12px;
      padding: 16px;
      background: #0a1524;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      min-width: 0;
      background: #0a1524;
      color: white;
      border: 1px solid #176b8b;
      border-radius: 8px;
      padding: 13px;
    }
    button {
      background: #087eaa;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }
    #status { margin-top: 18px; color: #a0b8ce; }
  </style>
</head>
<body>
  <h1>J.A.R.V.I.S.</h1>
  <div class="orb"></div>
  <div id="chat" aria-live="polite">
    JARVIS: Sistemas iniciados. Olá! Estou pronto para seu primeiro teste.
  </div>
  <div class="controls">
    <input id="message" placeholder="Digite uma mensagem..." />
    <button id="send">Enviar</button>
  </div>
  <button id="voice" style="margin-top:12px">🔊 Falar resposta</button>
  <p id="status">Protótipo inicial — conexão com IA ainda não configurada.</p>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");

    function respond() {
      const message = input.value.trim();
      if (!message) return;

      const userLine = document.createElement("p");
      userLine.textContent = "Você: " + message;
      chat.appendChild(userLine);

      const reply = document.createElement("p");
      const text = message.toLowerCase().includes("olá")
        ? "Olá, chefe! JARVIS online. Como posso ajudar?"
        : "Recebido, chefe! Ainda estou aprendendo. Minha conexão com uma IA será configurada depois.";
      reply.textContent = "JARVIS: " + text;
      chat.appendChild(reply);
      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("send").addEventListener("click", respond);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") respond();
    });

    document.getElementById("voice").addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        alert("Este navegador não oferece leitura de voz.");
        return;
      }
      const speech = new SpeechSynthesisUtterance(
        "Olá, chefe! JARVIS está online."
      );
      speech.lang = "pt-BR";
      window.speechSynthesis.speak(speech);
    });
  </script>
</body>
</html>
