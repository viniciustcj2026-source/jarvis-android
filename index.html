
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040b15">
  <title>J.A.R.V.I.S. — Assistente Pessoal</title>

  <style>
    :root {
      --cyan: #36dcff;
      --green: #83ffe0;
      --background: #040b15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 25%, #10314a, transparent 55%),
        linear-gradient(#081725, var(--background));
      color: #e8faff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 22px 16px 32px;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
      color: #7be7ff;
      font-size: clamp(30px, 7vw, 52px);
      letter-spacing: 7px;
      text-shadow: 0 0 20px #00bfff;
    }

    .subtitle {
      color: #9db8c9;
      font-size: 11px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    .visualizer {
      width: min(82vw, 360px);
      margin: 28px auto 14px;
      position: relative;
      animation: float 5s ease-in-out infinite;
    }

    .visualizer::before {
      content: "";
      position: absolute;
      inset: 5%;
      border: 1px solid #31dfff65;
      border-radius: 50%;
      box-shadow: 0 0 22px #00cfff30;
      pointer-events: none;
    }

    .visualizer img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 0 14px #00cfff70);
    }

    .visualizer.active {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 5px #00cfff); }
      50% { filter: drop-shadow(0 0 25px #00e5ff); }
    }

    .status {
      min-height: 25px;
      margin: 12px 0 20px;
      color: #a7c5d5;
      font-size: 14px;
    }

    .chat {
      min-height: 260px;
      max-height: 420px;
      overflow-y: auto;
      padding: 20px;
      text-align: left;
      background: #04111fee;
      border: 1px solid #1684a6;
      border-radius: 18px;
      box-shadow: 0 0 22px #00bfff12;
    }

    .message {
      margin: 0 0 18px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 16px;
    }

    .message.jarvis { color: var(--green); }
    .message.user { color: #bce9ff; }

    .message strong { color: #7be7ff; }

    .input-row {
      display: flex;
      gap: 9px;
      margin-top: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #237f9e;
      border-radius: 13px;
      outline: none;
      background: #071523;
      color: white;
      font-size: 16px;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 10px #00bfff35;
    }

    button {
      padding: 14px 19px;
      border: 1px solid #47dfff;
      border-radius: 13px;
      background: #087fa8;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .voice-button {
      width: 100%;
      min-height: 54px;
      margin-top: 12px;
    }

    .secondary-button {
      margin-top: 9px;
      background: #0b1b2a;
      border-color: #245b73;
    }

    .footer {
      margin-top: 20px;
      color: #6e91a5;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      h1 { letter-spacing: 4px; }
      .chat { padding: 16px; }
      .input-row button { padding: 12px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>J.A.R.V.I.S.</h1>
      <div class="subtitle">
        JUST A RATHER VERY INTELLIGENT SYSTEM
      </div>
    </header>

    <div class="visualizer" id="visualizer">
      <img
        src="C:\Users\Aluno\Desktop\manha\Nova pasta (2)\jarvis-core.webp.jpg"
        alt="Interface futurista do JARVIS"
        onerror="this.style.display='none';document.getElementById('imageError').hidden=false"
      >
      <div id="imageError" hidden style="color:#83ffe0;padding:25px">
        Imagem não encontrada. Confira o arquivo jarvis-core.webp.
      </div>
    </div>

    <div class="status" id="status">Sistemas inicializados.</div>

    <section class="chat" id="chat" aria-live="polite">
      <p class="message jarvis">
        <strong>JARVIS:</strong> Olá, chefe! Estou pronto. Pode me perguntar qualquer coisa.
      </p>
    </section>

    <form class="input-row" id="messageForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Converse com JARVIS..."
        autocomplete="off"
        aria-label="Mensagem para JARVIS"
        maxlength="4000"
        required
      >
      <button id="sendButton" type="submit">Enviar</button>
    </form>

    <button class="voice-button" id="voiceButton" type="button">
      🎙️ Falar com JARVIS
    </button>

    <button class="secondary-button" id="stopButton" type="button">
      🔇 Parar voz
    </button>

    <div class="footer">
      J.A.R.V.I.S. — Assistente pessoal<br>
      Inteligência artificial conectada via Cloudflare
    </div>
  </main>

  <script>
    // Endereço público do seu servidor Cloudflare Workers.
    const API_URL = "https://jarvis-ai.johnnyjoymode57.workers.dev/";

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const form = document.getElementById("messageForm");
    const statusText = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");
    const voiceButton = document.getElementById("voiceButton");
    const stopButton = document.getElementById("stopButton");
    const visualizer = document.getElementById("visualizer");

    let recognition = null;
    let isListening = false;
    let requestInProgress = false;

    // Mantém um histórico curto para a IA conseguir acompanhar a conversa.
    const conversation = [];
    const MAX_HISTORY = 12;

    function addMessage(sender, text) {
      const message = document.createElement("p");
      message.className = "message " + sender;

      const label = document.createElement("strong");
      label.textContent = sender === "user" ? "VOCÊ: " : "JARVIS: ";

      message.appendChild(label);
      message.appendChild(document.createTextNode(text));
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text, active = false) {
      statusText.textContent = text;
      visualizer.classList.toggle("active", active);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        setStatus("Voz não suportada neste navegador.");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "pt-BR";
      utterance.rate = 1;
      utterance.pitch = 1;

      utterance.onstart = () => setStatus("JARVIS está falando...", true);
      utterance.onend = () => setStatus("Sistemas inicializados.");
      utterance.onerror = () => setStatus("Não foi possível reproduzir a voz.");

      window.speechSynthesis.speak(utterance);
    }

    async function sendMessage(text) {
      const cleanText = text.trim();

      if (!cleanText || requestInProgress) return;

      addMessage("user", cleanText);
      input.value = "";
      requestInProgress = true;
      sendButton.disabled = true;
      voiceButton.disabled = true;
      setStatus("Conectando à inteligência artificial...", true);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: cleanText,
            history: conversation
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "O servidor retornou o erro " + response.status);
        }

        if (!data.reply || typeof data.reply !== "string") {
          throw new Error("O servidor não retornou uma resposta válida.");
        }

        conversation.push(
          { role: "user", text: cleanText },
          { role: "assistant", text: data.reply }
        );

        while (conversation.length > MAX_HISTORY) {
          conversation.shift();
        }

        addMessage("jarvis", data.reply);
        setStatus("Resposta recebida da IA.");
        speak(data.reply);

      } catch (error) {
        console.error("Erro na comunicação com JARVIS:", error);

        let explanation = error.message ||
          "Não foi possível conectar à inteligência artificial.";

        if (error instanceof TypeError) {
          explanation =
            "Não consegui acessar o servidor. Verifique a conexão, o endereço do Worker e a configuração de CORS.";
        }

        addMessage(
          "jarvis",
          "Desculpe, chefe. Não consegui obter uma resposta da IA.\n\nDetalhes: " +
          explanation
        );

        setStatus("Falha na conexão com a IA.");
      } finally {
        requestInProgress = false;
        sendButton.disabled = false;
        voiceButton.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      sendMessage(input.value);
    });

    voiceButton.addEventListener("click", function() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        setStatus("Reconhecimento de voz indisponível. Use o Chrome ou digite.");
        return;
      }

      if (isListening && recognition) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        voiceButton.textContent = "🎙️ Estou ouvindo...";
        setStatus("Pode falar, chefe...", true);
      };

      recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript;
        input.value = spokenText;
        sendMessage(spokenText);
      };

      recognition.onerror = function() {
        setStatus("Não consegui ouvir. Verifique a permissão do microfone.");
      };

      recognition.onend = function() {
        isListening = false;
        voiceButton.textContent = "🎙️ Falar com JARVIS";
      };

      try {
        recognition.start();
      } catch (error) {
        setStatus("Não foi possível iniciar o microfone.");
      }
    });

    stopButton.addEventListener("click", function() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      if (recognition && isListening) {
        recognition.stop();
      }

      setStatus("Reprodução de voz interrompida.");
    });
  </script>
</body>
